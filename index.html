<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Acute Enceph">
<meta name="description" content="Bedside decision support for acute encephalopathy, based on the 2020 consensus nomenclature.">
<title>Acute Encephalopathy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
<script>
  // Apply the saved Light/Dark and text size before first paint (no flash). Display settings only; no answers are stored.
  (function () {
    var p = {}; try { p = JSON.parse(localStorage.getItem('ae-display') || '{}'); } catch (e) {}
    var dark = p.theme ? p.theme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-text', p.text === 'large' ? 'large' : 'standard');
  })();
</script>
</head>
<body>
<div class="device-frame">
  <div class="device-island" aria-hidden="true"></div>
  <div class="device-btn side-mute" aria-hidden="true"></div>
  <div class="device-btn side-vol-up" aria-hidden="true"></div>
  <div class="device-btn side-vol-down" aria-hidden="true"></div>
  <div class="device-btn side-power" aria-hidden="true"></div>
  <div id="app" class="app"></div>
  <div class="device-home-bar" aria-hidden="true"></div>
</div>
<noscript><p style="padding:20px">This app needs JavaScript turned on.</p></noscript>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
